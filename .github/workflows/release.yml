name: Release

# Push a tag like v0.2.0 (it must match `version` in pyproject.toml). The workflow builds the web
# dashboard, packs tslow-0.2.0.zip and SHA256SUMS, and attaches both to a GitHub Release. These two
# assets are exactly what `tslow update` looks for.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check the tag matches pyproject.toml
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $declared = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($version -ne $declared) { throw "Tag $version does not match pyproject version $declared" }
      - name: Run the tests
        shell: pwsh
        run: |
          python -m pip install ".[daemon,cli,web,dev]"
          python -m pytest -q
      - name: Build the web dashboard
        shell: pwsh
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Pack the release
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $zip = "tslow-$version.zip"
          New-Item -ItemType Directory -Path stage/web | Out-Null
          Copy-Item -Recurse src, config, requirements.lock, pyproject.toml, README.md, LICENSE stage/
          Copy-Item -Recurse web/dist stage/web/dist
          Compress-Archive -Path stage/* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -FilePath SHA256SUMS -Encoding ascii
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            tslow-*.zip
            SHA256SUMS
          generate_release_notes: true
