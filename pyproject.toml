[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tslow"
version = "0.1.1"
description = "System Monitor & Optimizer for Windows"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "==3.12.*"
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "psutil>=6.0",
]

[project.optional-dependencies]
daemon = [
    "pywin32>=306",
    "windows-toasts>=1.3,<1.4",
    "plyer>=2.1",
]
cli = [
    "typer>=0.12",
    "rich>=13.7",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",  # richiesto da fastapi.testclient.TestClient
]

[project.scripts]
tslow = "tslow.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tslow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
